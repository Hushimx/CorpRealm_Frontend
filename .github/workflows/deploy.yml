name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: corprealm-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish and restart
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh="ssh -i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
          $ssh root@92.42.47.200 'mkdir -p /opt/corprealm/frontend'
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            -e "$ssh" \
            ./ root@92.42.47.200:/opt/corprealm/frontend/
          $ssh root@92.42.47.200 'bash /opt/corprealm/backend/deploy/deploy.sh web'
